apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: k8simp13-shop-b
    cloudman.io/creator: rmay-struct
  namespace: shop-b
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      serviceAccountName: web-sa
      containers:
        - image: "public.ecr.aws/nginx/nginx:stable"
          imagePullPolicy: IfNotPresent
          name: web
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - secretRef:
                name: db-creds
            - secretRef:
                name: api-key
          volumeMounts:
            - name: secrets-store-api-key
              mountPath: /mnt/secrets-store/api-key
              readOnly: true
            - name: secrets-store-db-creds
              mountPath: /mnt/secrets-store/db-creds
              readOnly: true
      volumes:
        - name: secrets-store-api-key
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: api-key
        - name: secrets-store-db-creds
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: db-creds
    metadata:
      labels:
        app.kubernetes.io/name: web
  selector:
    matchLabels:
      app.kubernetes.io/name: web
