apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: k8simp14-shop-a
    cloudman.io/creator: rmay-struct
  namespace: shop-a
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      serviceAccountName: web-sa
      containers:
        - image: "public.ecr.aws/nginx/nginx:stable"
          imagePullPolicy: IfNotPresent
          name: web
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
    metadata:
      labels:
        app.kubernetes.io/name: web
  selector:
    matchLabels:
      app.kubernetes.io/name: web
