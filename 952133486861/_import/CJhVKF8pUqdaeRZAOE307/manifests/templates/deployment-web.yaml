apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: app-a-2
    cloudman.io/creator: rmay-struct
  annotations:
    example.com/owner: "shop"
    argocd.argoproj.io/sync-wave: "0"
  namespace: app-a
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: web
      terminationGracePeriodSeconds: 30
      volumes:
        - name: files
          configMap:
            name: web-files
      containers:
        - image: "nginx:1.27-alpine"
          imagePullPolicy: IfNotPresent
          name: web
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            - name: GREETING
              value: "hello"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
            - name: files
              mountPath: /etc/app
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
      serviceAccountName: web
    metadata:
      labels:
        app: web
