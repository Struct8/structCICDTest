apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuned
  labels:
    app: tuned
    app.kubernetes.io/name: tuned
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: app-a-2
    cloudman.io/creator: rmay-struct
  namespace: app-a
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tuned
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zone
                    operator: In
                    values:
                      - a
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - "-c"
            - "true"
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          name: init
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: "core"
      containers:
        - command:
            - sh
            - "-c"
            - while true; do sleep 3600; done
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          name: app
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          resources:
            requests:
              cpu: "10m"
    metadata:
      annotations:
        example.com/restarted-at: "2026-11-01"
      labels:
        app: tuned
        tier: back
