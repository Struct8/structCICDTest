apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: app-a
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: app-a
    cloudman.io/creator: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: db
  ports:
