apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: app-a
    cloudman.io/creator: rmay-struct
  namespace: app-a
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: db
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  template:
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          name: db
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
            - name: data
              mountPath: /data
    metadata:
      labels:
        app: db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: lab-gp3
        resources:
          requests:
            storage: "1Gi"
  serviceName: db
