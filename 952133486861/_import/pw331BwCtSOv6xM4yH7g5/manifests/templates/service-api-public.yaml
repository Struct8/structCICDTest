apiVersion: v1
kind: Service
metadata:
  name: api-public
  namespace: svc-lab
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "120"
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: api-public
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: svc-lab
    cloudman.io/creator: rmay-struct
spec:
  allocateLoadBalancerNodePorts: true
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
  externalTrafficPolicy: Local
