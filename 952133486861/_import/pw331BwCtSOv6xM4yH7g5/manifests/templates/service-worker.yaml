apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: svc-lab
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: svc-lab
    cloudman.io/creator: rmay-struct
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  selector:
    app: worker
    tier: backend
  ports:
    - name: queue
      port: 9000
      targetPort: 8080
      protocol: TCP
