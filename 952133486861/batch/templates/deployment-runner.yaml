apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  labels:
    app.kubernetes.io/name: runner
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: batch
    cloudman.io/creator: rmay-struct
  namespace: batch
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - command:
            - sh
            - "-c"
            - while true; do echo "OK $(date -u +%FT%TZ) fargate"; sleep 30; done
          image: "busybox:1.37"
          imagePullPolicy: IfNotPresent
          name: runner
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
    metadata:
      labels:
        app: runner
