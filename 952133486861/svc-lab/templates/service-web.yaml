apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: svc-lab
  annotations:
    example.com/owner: "shop"
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: svc-lab
    cloudman.io/creator: rmay-struct
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: ClientIP
