apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: store
    cloudman.io/creator: rmay-struct
  namespace: store
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        pool: arm
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      volumes:
        - name: html
          configMap:
            name: web-config
      containers:
        - image: "nginx:1.29-alpine"
          imagePullPolicy: IfNotPresent
          name: web
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            - name: GREETING
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
    metadata:
      labels:
        app: web
