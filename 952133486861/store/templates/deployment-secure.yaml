apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure
  labels:
    app.kubernetes.io/name: secure
    app.kubernetes.io/managed-by: struct8
    app.kubernetes.io/instance: store
    cloudman.io/creator: rmay-struct
  namespace: store
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: secure
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        eks.amazonaws.com/nodegroup: k8simp18-lt
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - command:
            - sh
            - "-c"
            - while true; do if nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then echo "OK $(date -u +%FT%TZ) dns"; else echo "FAIL $(date -u +%FT%TZ) dns"; fi; sleep 30; done
          image: "busybox:1.37"
          imagePullPolicy: IfNotPresent
          name: secure
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-11-19T07:51:17-03:00"
      labels:
        app: secure
